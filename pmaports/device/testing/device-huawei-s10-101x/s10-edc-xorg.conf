# Huawei MediaPad 10 FHD: use the bootloader simple-framebuffer.
# Native EDC KMS is not ready yet, so /dev/dri/card0 may not exist.
Section "Device"
    Identifier "S10 SimpleFB"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "Screen"
    Identifier "S10 Screen"
    Device "S10 SimpleFB"
    DefaultDepth 24
EndSection
