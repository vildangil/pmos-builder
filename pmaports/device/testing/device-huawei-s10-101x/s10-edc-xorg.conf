# Huawei MediaPad 10 FHD: Hi3620 EDC KMS without GC4000 acceleration.
# Keep the modesetting DDX on card0, but avoid the old extra ShadowFB copy.
Section "Device"
    Identifier "S10 EDC KMS"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "PageFlip" "true"
    Option "SWcursor" "true"
    Option "ShadowFB" "false"
EndSection

Section "Screen"
    Identifier "S10 Screen"
    Device "S10 EDC KMS"
    DefaultDepth 24
EndSection
