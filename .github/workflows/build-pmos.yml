name: Build postmarketOS

on:
  workflow_dispatch:
    inputs:
      channel:
        description: postmarketOS channel
        required: true
        default: edge
        type: choice
        options:
          - edge
          - v26.06
      ui:
        description: User interface (console recommended until display works)
        required: true
        default: console
        type: choice
        options:
          - console
          - fbkeyboard
          - weston
          - xfce4
          - phosh
          - plasma-mobile
      username:
        description: Linux username to create in the image
        required: true
        default: user
        type: string
      password:
        description: Temporary Linux password (workflow inputs are not secret)
        required: true
        default: pmos-test
        type: string
      ui_extras:
        description: Install optional extras for the selected UI
        required: true
        default: false
        type: boolean
      debug_tools:
        description: Add bring-up/debug packages
        required: true
        default: true
        type: boolean
      extra_packages:
        description: Extra packages, comma-separated (optional)
        required: false
        default: ""
        type: string
      extra_space_mb:
        description: Extra rootfs image space in MiB
        required: true
        default: "1024"
        type: choice
        options:
          - "512"
          - "1024"
          - "2048"
          - "4096"
      enable_sshd:
        description: Enable SSH server in the image
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      PMB_CONFIG: ${{ github.workspace }}/pmbootstrap_v3.cfg
      PMB_WORK: ${{ github.workspace }}/pmbootstrap-work
      PMAPORTS_DIR: ${{ github.workspace }}/pmaports-src
      PMBOOTSTRAP_DIR: ${{ github.workspace }}/pmbootstrap-src
      KERNEL_META: ${{ github.workspace }}/kernel-release.txt

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install host requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git python3 openssl procps tar sudo unzip \
            qemu-user-static binfmt-support \
            e2fsprogs util-linux xz-utils

      - name: Clone pmbootstrap and pmaports
        shell: bash
        env:
          PMOS_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$PMBOOTSTRAP_DIR"

          if [[ "$PMOS_CHANNEL" == "edge" ]]; then
            PMAPORTS_BRANCH="main"
          else
            PMAPORTS_BRANCH="$PMOS_CHANNEL"
          fi

          git clone --depth=1 --branch "$PMAPORTS_BRANCH" \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$PMAPORTS_DIR"

          cp -a pmaports/device/testing/device-huawei-s10-101x \
            "$PMAPORTS_DIR/device/testing/"
          cp -a pmaports/device/testing/linux-huawei-s10-101x \
            "$PMAPORTS_DIR/device/testing/"

      - name: Fetch latest released kernel
        shell: bash
        run: |
          set -euxo pipefail

          APORDIR="$PMAPORTS_DIR/device/testing/linux-huawei-s10-101x"
          KERNEL_URL="https://github.com/vildangil/mediapad-s10-hi3620-linux/releases/latest/download/kernel.zip"

          EFFECTIVE_URL="$(curl \
            --fail --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            --user-agent 'pmos-builder/1.0' \
            --silent --show-error \
            --write-out '%{url_effective}' \
            --output /tmp/kernel.zip \
            "$KERNEL_URL")"

          [[ -s /tmp/kernel.zip ]] || { echo 'Downloaded kernel.zip is empty' >&2; exit 2; }

          KERNEL_TAG="$(python3 - "$EFFECTIVE_URL" <<'PY'
          import re
          import sys

          url = sys.argv[1]
          match = re.search(r"/releases/download/([^/]+)/kernel\.zip(?:\?.*)?$", url)
          print(match.group(1) if match else "latest")
          PY
          )"

          KERNEL_ZIP_SHA256="$(sha256sum /tmp/kernel.zip | awk '{print $1}')"

          rm -rf /tmp/kernel-release
          mkdir -p /tmp/kernel-release
          unzip -tq /tmp/kernel.zip
          unzip -q /tmp/kernel.zip -d /tmp/kernel-release
          find /tmp/kernel-release -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

          ZIMAGE="$(find /tmp/kernel-release -type f -name zImage -print -quit)"
          DTB="$(find /tmp/kernel-release -type f -name hi3620-s10-101x.dtb -print -quit)"
          KREL="$(find /tmp/kernel-release -type f -name kernel.release -print -quit)"

          [[ -n "$ZIMAGE" && -s "$ZIMAGE" ]] || { echo 'kernel.zip is missing zImage' >&2; exit 2; }
          [[ -n "$DTB" && -s "$DTB" ]] || { echo 'kernel.zip is missing hi3620-s10-101x.dtb' >&2; exit 2; }

          cp "$ZIMAGE" "$APORDIR/zImage"
          cp "$DTB" "$APORDIR/hi3620-s10-101x.dtb"

          if [[ -n "$KREL" && -s "$KREL" ]]; then
            cp "$KREL" "$APORDIR/kernel.release"
          else
            printf '%s\n' '4.9.51' > "$APORDIR/kernel.release"
          fi

          ZSUM="$(sha512sum "$APORDIR/zImage" | awk '{print $1}')"
          DSUM="$(sha512sum "$APORDIR/hi3620-s10-101x.dtb" | awk '{print $1}')"
          KSUM="$(sha512sum "$APORDIR/kernel.release" | awk '{print $1}')"

          sed -i \
            -e "s/__ZIMAGE_SHA512__/$ZSUM/" \
            -e "s/__DTB_SHA512__/$DSUM/" \
            -e "s/__KERNEL_RELEASE_SHA512__/$KSUM/" \
            "$APORDIR/APKBUILD"

          {
            echo "tag=$KERNEL_TAG"
            echo "url=$EFFECTIVE_URL"
            echo "kernel_zip_sha256=$KERNEL_ZIP_SHA256"
            echo "zImage_sha256=$(sha256sum "$APORDIR/zImage" | awk '{print $1}')"
            echo "dtb_sha256=$(sha256sum "$APORDIR/hi3620-s10-101x.dtb" | awk '{print $1}')"
            echo "kernel_release=$(cat "$APORDIR/kernel.release")"
          } | tee "$KERNEL_META"

          grep -qv '__.*_SHA512__' "$APORDIR/APKBUILD"

      - name: Configure pmbootstrap
        shell: bash
        env:
          PMOS_CHANNEL: ${{ inputs.channel }}
          PMOS_UI: ${{ inputs.ui }}
          PMOS_UI_EXTRAS: ${{ inputs.ui_extras }}
          PMOS_USER: ${{ inputs.username }}
        run: |
          set -euxo pipefail
          mkdir -p "$(dirname "$PMB_CONFIG")"

          if [[ ! "$PMOS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "Invalid username: use lowercase letters, digits, underscore or dash; start with a letter/underscore" >&2
            exit 2
          fi

          if [[ "$PMOS_CHANNEL" == "edge" ]]; then
            IS_DEFAULT_CHANNEL="True"
          else
            IS_DEFAULT_CHANNEL="False"
          fi

          if [[ "$PMOS_UI_EXTRAS" == "true" ]]; then
            UI_EXTRAS="True"
          else
            UI_EXTRAS="False"
          fi

          cat > "$PMB_CONFIG" <<EOF
          [pmbootstrap]
          aports = $PMAPORTS_DIR
          device = huawei-s10-101x
          hostname = mediapad-s10
          is_default_channel = $IS_DEFAULT_CHANNEL
          service_manager = openrc
          ui = $PMOS_UI
          ui_extras = $UI_EXTRAS
          user = $PMOS_USER
          locale = en_US.UTF-8
          timezone = GMT
          build_pkgs_on_install = True
          work = $PMB_WORK
          EOF

          WORK_VERSION="$(python3 - "$PMBOOTSTRAP_DIR" <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1]) / "pmb"
          patterns = (
              re.compile(r"(?m)^work_version\s*=\s*(\d+)\s*$"),
              re.compile(r"(?m)^WORK_VERSION\s*=\s*(\d+)\s*$"),
          )

          for path in root.rglob("*.py"):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for pattern in patterns:
                  match = pattern.search(text)
                  if match:
                      print(match.group(1))
                      raise SystemExit(0)

          raise SystemExit("Could not determine pmbootstrap work folder version")
          PY
          )"

          install -d -m 700 "$PMB_WORK"
          printf '%s\n' "$WORK_VERSION" > "$PMB_WORK/version"
          echo "Initialized pmbootstrap workdir schema version $WORK_VERSION"

          "$PMBOOTSTRAP_DIR/pmbootstrap.py" \
            -c "$PMB_CONFIG" --details-to-stdout status

      - name: Build installation
        shell: bash
        env:
          DEBUG_TOOLS: ${{ inputs.debug_tools }}
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
          EXTRA_SPACE_MB: ${{ inputs.extra_space_mb }}
          ENABLE_SSHD: ${{ inputs.enable_sshd }}
          PMOS_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail

          if [[ -z "$PMOS_PASSWORD" ]]; then
            echo "Password must not be empty" >&2
            exit 2
          fi

          PMB="$PMBOOTSTRAP_DIR/pmbootstrap.py"
          ADD_PACKAGES=""

          if [[ "$DEBUG_TOOLS" == "true" ]]; then
            ADD_PACKAGES="strace,evtest,i2c-tools,mmc-utils,util-linux,e2fsprogs-extra,nano"
          fi

          USER_PACKAGES="$(echo "$EXTRA_PACKAGES" | tr -d '[:space:]')"
          if [[ -n "$USER_PACKAGES" ]]; then
            if [[ -n "$ADD_PACKAGES" ]]; then
              ADD_PACKAGES="$ADD_PACKAGES,$USER_PACKAGES"
            else
              ADD_PACKAGES="$USER_PACKAGES"
            fi
          fi

          INSTALL_ARGS=(
            --split
            --filesystem ext4
            --password "$PMOS_PASSWORD"
          )

          if [[ "$ENABLE_SSHD" != "true" ]]; then
            INSTALL_ARGS+=(--no-sshd)
          fi

          if [[ -n "$ADD_PACKAGES" ]]; then
            INSTALL_ARGS+=(--add "$ADD_PACKAGES")
          fi

          # Huawei cache is 256 MiB. pmbootstrap defaults to a 512 MiB
          # split boot filesystem, so force it down to 128 MiB. The heavy
          # initramfs-extra and /boot contents easily fit there.
          "$PMB" \
            -c "$PMB_CONFIG" \
            -B 128 \
            -E "$EXTRA_SPACE_MB" \
            -y --details-to-stdout \
            install "${INSTALL_ARGS[@]}"

      - name: Export images
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts/export artifacts/boot artifacts/bootfs artifacts/rootfs

          "$PMBOOTSTRAP_DIR/pmbootstrap.py" \
            -c "$PMB_CONFIG" \
            -B 128 \
            -y --details-to-stdout \
            export "$GITHUB_WORKSPACE/artifacts/export"

          BOOT_IMG="$(find artifacts/export -maxdepth 1 -type f -name boot.img -print -quit)"
          BOOTFS_IMG="$(find artifacts/export -maxdepth 1 -type f -name '*-boot.img' -print -quit)"
          ROOT_IMG="$(find artifacts/export -maxdepth 1 -type f -name '*-root.img' -print -quit)"

          [[ -n "$BOOT_IMG" && -s "$BOOT_IMG" ]] || { echo 'pmbootstrap export did not produce boot.img' >&2; exit 2; }
          [[ -n "$BOOTFS_IMG" && -s "$BOOTFS_IMG" ]] || { echo 'pmbootstrap export did not produce split boot filesystem image' >&2; exit 2; }
          [[ -n "$ROOT_IMG" && -s "$ROOT_IMG" ]] || { echo 'pmbootstrap export did not produce split root filesystem image' >&2; exit 2; }

          cp "$BOOT_IMG" artifacts/boot/boot.img
          cp "$BOOTFS_IMG" artifacts/bootfs/postmarketos-bootfs.img
          cp "$ROOT_IMG" artifacts/rootfs/postmarketos-rootfs.img

          printf '%s\n' \
            'layout=split-initfs-extra' \
            'boot_target=boot' \
            'boot_partition_size_mib=8' \
            'bootfs_target=cache' \
            'bootfs_partition_size_mib=256' \
            'bootfs_image_size_mib=128' \
            'rootfs_target=VERIFY_P22_DATA' \
            'note=p18_userdata_is_only_16MiB_do_not_flash_rootfs_there' \
            "bootfs_export_name=$(basename "$BOOTFS_IMG")" \
            "rootfs_export_name=$(basename "$ROOT_IMG")" \
            > artifacts/layout.txt

          cp "$PMB_CONFIG" artifacts/pmbootstrap_v3.cfg
          cp "$KERNEL_META" artifacts/kernel-release.txt
          cp pmaports/device/testing/device-huawei-s10-101x/deviceinfo artifacts/deviceinfo
          cp pmaports/device/testing/device-huawei-s10-101x/kernel-cmdline.conf artifacts/kernel-cmdline.conf

          if [[ -f "$PMB_WORK/log.txt" ]]; then
            cp "$PMB_WORK/log.txt" artifacts/pmbootstrap.log
          fi

          find artifacts -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > artifacts/SHA256SUMS
          find artifacts -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Collect failure log
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          cp "$PMB_CONFIG" artifacts/pmbootstrap_v3.cfg 2>/dev/null || true
          cp "$KERNEL_META" artifacts/kernel-release.txt 2>/dev/null || true
          cp "$PMB_WORK/log.txt" artifacts/pmbootstrap.log 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-huawei-s10-101x-${{ inputs.channel }}-${{ inputs.ui }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
